apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentimentizer-ingress
  labels:
    app: sentimentizer
  annotations:
    # Uncomment based on your ingress controller:
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # tls:
  # - hosts:
  #   - sentimentizer.example.com
  #   secretName: sentimentizer-tls
  rules:
  - host: sentimentizer.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentimentizer
            port:
              number: 8000