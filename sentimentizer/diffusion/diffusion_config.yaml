# Native ComfyUI checkpoint filenames. Files are resolved from ComfyUI's
# models/diffusion_models, models/text_encoders, and models/vae directories.
krea_2:
  transformer: "krea2_turbo_int8_convrot.safetensors"
  text_encoder: "qwen3vl_4b_fp8_scaled.safetensors"
  vae: "qwen_image_vae.safetensors"
  default_steps: 8
  default_guidance: 1.0
  max_pixels: 1048576
  dim_alignment: 16
  quantization: "int8_convrot"

ideogram_4:
  transformer: "ideogram4_int8_convrot.safetensors"
  unconditional_transformer: "ideogram4_unconditional_int8_convrot.safetensors"
  text_encoder: "qwen3vl_8b_fp8_scaled.safetensors"
  vae: "flux2-vae.safetensors"
  default_steps: 20
  default_guidance: 7.0
  max_pixels: 1048576
  dim_alignment: 16
  quantization: "int8_convrot"
