# Sentimentizer Serve Configuration
# Controls the Ray Serve deployment settings.
# Environment variables override these defaults when set.

# Default sentiment model to load (rnn, encoder, decoder)
default_model: "encoder"

# Router model path (local directory or HuggingFace model ID)
router_model_path: "models/router"

# Request limits
max_batch_size: 64           # Maximum texts per /v1/batch request
max_text_length: 10000       # Maximum characters per text input

# Auto-batching for /v1/predict (serve.batch)
predict_batch_size: 32        # Maximum requests collected per batch
predict_batch_wait_s: 0.05    # Seconds to wait before processing a partial batch

# Auto-batching for /v1/router/predict (serve.batch)
classify_batch_size: 32       # Maximum requests collected per batch
classify_batch_wait_s: 0.05   # Seconds to wait before processing a partial router batch

# CORS configuration
# Set to ["*"] for development, restrict in production via env var
cors_origins:
  - "*"

# Diffusion serving (image generation) — disabled by default
flux2_klein_enabled: false
flux2_klein_model_id: "black-forest-labs/FLUX.2-klein-4B"
flux2_klein_cpu_offload: ""        # "", "model", or "sequential"
# bitsandbytes quantization for FLUX.2 transformer + Qwen3 text encoder.
# "" off, "nf4" 4-bit (~5 GB peak — fits 11 GB cards like 2080 Ti),
# "int8" 8-bit (~9 GB peak). Requires `bitsandbytes`. Pair with
# flux2_klein_cpu_offload: "model" on 11 GB cards.
flux2_klein_quantization: ""
flux2_klein_backend: "auto"    # "auto", "diffusers", or "mlx"
sd35_enabled: false
sd35_model_id: "stabilityai/stable-diffusion-3.5-medium"
sd35_cpu_offload: ""               # "", "model", or "sequential"
# Named SDXL slots: each entry is "name:model_id". Supports anime fine-tunes
# (e.g. "anime:John6666/noob-sdxl-v10") addressable by slot name in requests.
sdxl_models: []
default_image_model: "sd35"
request_timeout_s: 600

# Middleware for image routes
api_keys: []
rate_limit_per_min: 60
rate_limit_burst: 10
idempotency_ttl_s: 600
job_ttl_s: 3600
prompt_blocklist_path: ""

# Optional embedding deployments. Keep disabled on sentiment-only pods.
embeddings_enabled: false
embeddings_device: "auto"       # auto, cpu, cuda, or mps
dense_embedding_model_id: "nomic-ai/nomic-embed-text-v1.5"
dense_embedding_revision: "161a1515eaa28482dfe6ceae96cdefdd20dabcbd"
bge_m3_enabled: false
bge_m3_model_id: "BAAI/bge-m3"
bge_m3_use_fp16: false           # effective only on CUDA
bge_m3_batch_size: 12
bge_m3_batch_wait_s: 0.01
