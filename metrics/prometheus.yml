global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'ray'
    # Scrape Ray metrics from the host machine
    # honor_labels ensures Ray's internal labels (SessionName, RayNodeType,
    # ray_io_cluster, instance) are preserved rather than overridden by
    # Prometheus scrape labels. Without this, dashboards that filter by
    # SessionName or instance show empty results.
    honor_labels: true
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'sentimentizer'
    # Scrape Sentimentizer application metrics (system, GPU, Ray health)
    # and pre-initialized training gauges (always 0 until training runs).
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'sentimentizer-training'
    # Scrape live training metrics from the driver process.
    # This port is started by _ensure_metrics_server() during training runs
    # and provides real-time updates as training progresses.
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'sentimentizer-tune'
    # Scrape Sentimentizer Ray Tune trial metrics (accuracy, loss, F1, etc.)
    # This port is started automatically by tune_model() during tuning runs.
    static_configs:
      - targets: ['host.docker.internal:8082']
