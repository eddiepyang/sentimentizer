[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentimentizer"
version = "0.101.0"
description = "straight forward rnn model"
readme = "README.md"
authors = [{ name = "Edward Yang", email = "edwardpyang@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
keywords = ["rnn", "pytorch", "nlp", "sentiment"]

dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.2",
    "torch>=2.10",
    "orjson>=3.8.5",
    "pyarrow>=11.0.0",
    "scikit-learn",
    "gensim>=4.3.3",
    "smart_open>=7.0.1",
    "structlog",
    "psutil",
    "prometheus_client>=0.14.0",
    "ray[data]>=2.5.0",
    "ray[serve]>=2.5.0",
    "ray[train]>=2.5.0",
    "ray[tune]>=2.5.0",
    "optuna>=3.5",
    "pyyaml>=6.0",
    "pydantic-ai-slim[openai]>=0.0.36",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["sentimentizer"]

[dependency-groups]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "ANN401",  # Any is acceptable in some cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO.*:FutureWarning",
    "ignore:.*use_push_based_shuffle.*:DeprecationWarning",
    "ignore:.*use_polars.*:DeprecationWarning",
    "ignore:.*use_arrow_tensor_v2.*:DeprecationWarning"
]
