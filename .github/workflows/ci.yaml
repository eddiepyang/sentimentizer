name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: setup timezone
      uses: zcong1993/setup-timezone@master
      with:
        timezone: UTC

    - name: set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: install dependencies (CPU-only torch + ray + onnx + router)
      run: uv sync --extra dev,ray,onnx,router

    - name: ruff lint
      run: uv run ruff check .

    - name: black format check
      run: uv run black --check .

    - name: test with pytest
      run: |
        uv run pytest --exitfirst --verbose --failed-first \
          --cov=sentimentizer --cov=workflows \
          --cov-report=term-missing --cov-report=html
      working-directory: .
      env:
        RAY_DISABLE_IMPORT_WARNING: "1"
